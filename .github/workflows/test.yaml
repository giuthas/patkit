name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Qt and Audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb libportaudio2 pulseaudio

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Start dummy audio server
        run: pulseaudio -D --exit-idle-time=-1

      - name: Run Tests
        run: xvfb-run uv run pytest tests
        env:
          QT_QPA_PLATFORM: offscreen